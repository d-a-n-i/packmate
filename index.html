<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>PackMate — Smart Trip Packing Assistant</title>
    <meta
      name="description"
      content="PackMate builds a right-sized packing list for any trip. Set the length, traveler profile and trip type — it scales quantities, tracks weight and volume, and recommends the luggage that fits."
    />
    <link rel="canonical" href="https://packmate.d85c.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS standalone / add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PackMate" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PackMate" />
    <meta property="og:title" content="PackMate — Smart Trip Packing Assistant" />
    <meta
      property="og:description"
      content="Set your trip length, traveler profile and trip type — PackMate builds a right-sized packing list, tracks weight and volume, and recommends the luggage that fits."
    />
    <meta property="og:url" content="https://packmate.d85c.com/" />
    <meta property="og:image" content="https://packmate.d85c.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PackMate — smart packing for any trip" />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="ru" />
    <meta property="og:locale:alternate" content="bg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PackMate — Smart Trip Packing Assistant" />
    <meta
      name="twitter:description"
      content="Set your trip, PackMate balances the list. Scales quantities, tracks weight & volume, recommends luggage."
    />
    <meta name="twitter:image" content="https://packmate.d85c.com/og.png" />
